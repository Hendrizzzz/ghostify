    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "Ghostify",
            "applicationCategory": "BrowserApplication",
            "operatingSystem": "Chrome, Edge, Firefox",
            "url": "https://ghostify-extension.vercel.app/",
            "description": "Free, open-source browser privacy controls for supported Seen, Typing, and Story View signals on Instagram, Messenger, and Facebook.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "author": { "@type": "Person", "name": "Hendrizzzz" },
            "license": "https://github.com/Hendrizzzz/Ghostify/blob/main/LICENSE"
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Why does Chrome say Ghostify can read and change data on these sites?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Ghostify needs access to supported Instagram, Messenger, and Facebook tabs so it can identify and hold the privacy signals you switch off. That access is limited to those Meta web apps and Meta’s own web-messaging proxy; Ghostify does not send your conversations, social activity, or tab URLs to a Ghostify server."
                }
              },
              {
                "@type": "Question",
                "name": "Does Ghostify read my messages?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Ghostify transiently inspects supported request URLs, payloads, and page or worker messages locally to identify privacy signals. It does not send conversations to Ghostify, store raw messages, or ask for social media passwords."
                }
              },
              {
                "@type": "Question",
                "name": "Does it work in the mobile apps?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Ghostify is a browser extension for the web versions of Instagram, Facebook, and Messenger. It cannot affect the native iOS or Android apps."
                }
              },
              {
                "@type": "Question",
                "name": "Which browsers are officially supported?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Ghostify officially supports Google Chrome, Microsoft Edge, and Mozilla Firefox. Opera, Opera GX, Opera Air, Brave, Vivaldi, Arc, Dia, Yandex Browser, and NAVER Whale may also run the Chrome build when they permit Chrome Web Store extensions, but browser-specific policies can change."
                }
              },
              {
                "@type": "Question",
                "name": "Can I choose different controls for each platform?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Instagram has its own controls. Messenger and Facebook share a second group, and each supported signal can be switched independently."
                }
              },
              {
                "@type": "Question",
                "name": "Can a platform update break a control?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Meta changes its web apps frequently. Ghostify publishes dated verification instead of promising permanent coverage and investigates credible reports when a control needs review."
                }
              },
              {
                "@type": "Question",
                "name": "What should I do after installing or updating?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Reload any open instagram.com, messenger.com, or facebook.com tabs so the current extension code starts before the page loads."
                }
              }
            ]
          }
        ]
      }
    </script>
