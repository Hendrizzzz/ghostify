    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "Ghostify",
            "applicationCategory": "BrowserApplication",
            "operatingSystem": "Chrome, Edge, Firefox",
            "url": "https://ghostify-extension.vercel.app/",
            "description": "A free, open-source browser extension that hides your Seen, Typing, and Story View signals on Instagram, Messenger, and Facebook.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "author": { "@type": "Person", "name": "Hendrizzzz" },
            "license": "https://github.com/Hendrizzzz/Ghostify/blob/main/LICENSE"
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Why does my browser say Ghostify can read and change data on these sites?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "It needs access to Instagram, Messenger, and Facebook tabs to hold the signals you switch off. That access is limited to those Meta web apps."
                }
              },
              {
                "@type": "Question",
                "name": "Does Ghostify read my messages?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "It checks requests inside your browser to find the signals. Your conversations are never sent to Ghostify or saved, and it never asks for your passwords."
                }
              },
              {
                "@type": "Question",
                "name": "Does it work in the phone apps?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Not in the apps. It works on the web versions in desktop browsers, and in Firefox for Android."
                }
              },
              {
                "@type": "Question",
                "name": "What if Meta changes something?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "It can break a switch. Every switch is checked by hand and the results are published on the status page."
                }
              }
            ]
          }
        ]
      }
    </script>
