name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags:
      - "v*"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Classify change scope
    runs-on: ubuntu-24.04
    outputs:
      status-only: ${{ steps.scope.outputs.status-only }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect canonical status-only change
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          status_only=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            base_sha="$MERGE_GROUP_BASE_SHA"
          fi
          if [[ -n "${base_sha:-}" ]]; then
            changed_files="$(git diff --name-only "$base_sha"...HEAD)"
            if [[ "$changed_files" == "site/src/app/statusData.json" ]]; then
              status_only=true
            fi
          fi
          echo "status-only=$status_only" >> "$GITHUB_OUTPUT"

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        run: docker run --rm -v "${{ github.workspace }}:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  chromium-extension:
    name: Chromium extension checks
    runs-on: ubuntu-24.04
    needs: change-scope

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Chromium functional and package checks
        run: npm run ci:chromium:checks

      - name: Audit extension runtime dependencies
        if: needs.change-scope.outputs.status-only == 'true'
        run: npm run audit:runtime

      - name: Audit complete extension dependency graph
        if: needs.change-scope.outputs.status-only != 'true'
        run: npm run audit:high

  firefox-extension:
    name: Firefox extension checks
    runs-on: ubuntu-24.04
    needs: change-scope

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Firefox functional and package checks
        run: npm run ci:firefox:checks

      - name: Audit extension runtime dependencies
        if: needs.change-scope.outputs.status-only == 'true'
        run: npm run audit:runtime

      - name: Audit complete extension dependency graph
        if: needs.change-scope.outputs.status-only != 'true'
        run: npm run audit:high

  extension:
    name: Extension checks
    runs-on: ubuntu-24.04
    needs:
      - chromium-extension
      - firefox-extension

    steps:
      - name: Confirm browser checks passed
        run: echo "Chromium and Firefox extension checks passed."

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  site:
    name: Site build
    runs-on: ubuntu-24.04
    needs: change-scope

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site

      - name: Audit site runtime dependencies
        if: needs.change-scope.outputs.status-only == 'true'
        run: npm run audit:runtime
        working-directory: site

      - name: Audit complete site dependency graph
        if: needs.change-scope.outputs.status-only != 'true'
        run: npm audit --audit-level=high
        working-directory: site

  release-package:
    name: Chromium release package dry run
    runs-on: ubuntu-24.04
    needs:
      - chromium-extension
      - secret-scan

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create release package
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            npm run package:extension -- --expected-tag "${GITHUB_REF_NAME}"
          else
            npm run package:extension
          fi

      - name: Upload release package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-web-store-package
          path: |
            ghostify-v*-chrome-web-store.zip
            ghostify-v*-chrome-web-store.zip.sha256
          if-no-files-found: error

  firefox-release-package:
    name: Firefox Add-ons package dry run
    runs-on: ubuntu-24.04
    needs:
      - firefox-extension
      - secret-scan

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create Firefox Add-ons packages
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            npm run package:firefox -- --expected-tag "${GITHUB_REF_NAME}"
          else
            npm run package:firefox
          fi

      - name: Upload Firefox Add-ons review packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-add-ons-packages
          path: |
            ghostify-v*-firefox-add-ons.zip
            ghostify-v*-firefox-add-ons.zip.sha256
            ghostify-v*-firefox-add-ons-source.zip
            ghostify-v*-firefox-add-ons-source.zip.sha256
          if-no-files-found: error
