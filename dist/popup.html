<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=320">
    <title>Ghostify</title>
    <link rel="stylesheet" href="css/popup.css">
</head>

<body>
    <main class="popup-shell" aria-label="Ghostify privacy controls">
        <svg class="icon-sprite" aria-hidden="true">
            <defs>
                <symbol id="feature-seen" viewBox="0 0 24 24">
                    <path d="M18 6 7 17l-5-5" />
                    <path d="m22 10-7.5 7.5L13 16" />
                </symbol>
                <symbol id="feature-typing" viewBox="0 0 24 24">
                    <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
                    <circle class="feature-icon-fill" cx="8" cy="12" r="1.1" />
                    <circle class="feature-icon-fill" cx="12" cy="12" r="1.1" />
                    <circle class="feature-icon-fill" cx="16" cy="12" r="1.1" />
                </symbol>
                <symbol id="feature-story" viewBox="0 0 24 24">
                    <path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0" />
                    <circle cx="12" cy="12" r="3" />
                </symbol>
                <symbol id="fx-bat" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M12 6.2 13.1 8c1.9-1.6 5-2.2 9-1.4-1.3 1.2-1.8 3-1.5 5.2-1.3-1-2.9-1-4.1.2-.6-.9-1.5-1.2-2.4-1.2L12 13.5l-2.1-2.7c-.9 0-1.8.3-2.4 1.2-1.2-1.2-2.8-1.2-4.1-.2.3-2.2-.2-4-1.5-5.2 4-.8 7.1-.2 9 1.4L12 6.2Z" />
                </symbol>
                <symbol id="fx-pumpkin" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M12 7.5c-4.6 0-8 2.6-8 6.2S7.4 20 12 20s8-2.7 8-6.3-3.4-6.2-8-6.2Z" />
                    <path fill="currentColor" d="M12 7.6c0-1.7.7-3 2.2-3.6l.5 1.3c-.9.4-1.3 1.2-1.3 2.3Z" />
                    <path fill="none" stroke="var(--ghost-bg)" stroke-width="1.1" stroke-linecap="round" d="M12 8.5c-2.2 1.8-2.2 9.6 0 11M12 8.5c2.2 1.8 2.2 9.6 0 11" />
                </symbol>
                <symbol id="fx-ghost" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M12 3.5c-3.6 0-6 2.7-6 6.2v10.8l2-1.7 2 1.7 2-1.7 2 1.7 2-1.7 2 1.7V9.7c0-3.5-2.4-6.2-6-6.2Z" />
                    <circle fill="var(--ghost-bg)" cx="9.6" cy="10" r="1.2" />
                    <circle fill="var(--ghost-bg)" cx="14.4" cy="10" r="1.2" />
                </symbol>
                <symbol id="fx-snow" viewBox="0 0 24 24">
                    <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.8 12 7l2.5-2.2M9.5 19.2 12 17l2.5 2.2" />
                </symbol>
                <symbol id="fx-star" viewBox="0 0 24 24">
                    <path fill="currentColor" d="m12 2.8 2.5 6.1 6.5.5-5 4.2 1.6 6.4L12 16.7 6.4 20l1.6-6.4-5-4.2 6.5-.5Z" />
                </symbol>
                <symbol id="fx-spark" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M12 2.5 13.7 10.3 21.5 12l-7.8 1.7L12 21.5l-1.7-7.8L2.5 12l7.8-1.7Z" />
                </symbol>
                <symbol id="fx-ring" viewBox="0 0 24 24">
                    <circle fill="none" stroke="currentColor" stroke-width="2" cx="12" cy="12" r="6" />
                </symbol>
                <symbol id="fx-heart" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M12 20.8s-8-4.9-8-11.1A4.6 4.6 0 0 1 12 6.9a4.6 4.6 0 0 1 8 2.8c0 6.2-8 11.1-8 11.1Z" />
                </symbol>
                <symbol id="hw-jack" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M12 6.5c-5 0-9 2.9-9 6.8S7 20.5 12 20.5s9-3.3 9-7.2-4-6.8-9-6.8Z" />
                    <path fill="currentColor" d="M12 6.7c0-1.8.7-3.2 2.4-3.9l.6 1.4c-1 .5-1.5 1.4-1.5 2.5Z" />
                    <path class="hw-carve" d="m7.2 11 1.9 2.7H5.3ZM16.8 11l1.9 2.7h-3.8Z" />
                    <path class="hw-carve hw-carve--line" d="M7 16.4l1.6 1.4 1.7-1.4 1.7 1.4 1.7-1.4 1.6 1.4 1.7-1.4" />
                </symbol>
                <symbol id="hw-spider" viewBox="0 0 24 24">
                    <circle fill="currentColor" cx="12" cy="15" r="3.6" />
                    <circle fill="currentColor" cx="12" cy="10.6" r="2.2" />
                    <path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" d="M9.2 13.4 4.6 10.2 3.2 12M9 15.2 3.6 15.4 2.4 18M9.6 17 5.4 20.6 4.8 22.6M10.4 11.4 8 6.8 6.4 7.6M14.8 13.4l4.6-3.2 1.4 1.8M15 15.2l5.4.2 1.2 2.6M14.4 17l4.2 3.6.6 2M13.6 11.4 16 6.8l1.6.8" />
                </symbol>
            </defs>
        </svg>
        <header class="header">
            <svg class="ambient-fx" aria-hidden="true"><use href="#fx-bat"></use></svg>
            <svg class="ambient-fx ambient-fx--b" aria-hidden="true"><use href="#fx-bat"></use></svg>
            <svg class="hw-web" viewBox="0 0 66 66" aria-hidden="true"><path d="M0 0 L65.8 4.6 M0 0 L60.3 26.8 M0 0 L47.5 45.8 M0 0 L28.9 59.3 M0 0 L6.9 65.6 M14.0 1.0 Q11.1 2.8 12.8 5.7 M12.8 5.7 Q9.5 6.4 10.1 9.7 M10.1 9.7 Q6.7 9.3 6.1 12.6 M6.1 12.6 Q3.2 11.0 1.5 13.9 M27.9 2.0 Q22.3 5.6 25.6 11.4 M25.6 11.4 Q19.0 12.8 20.1 19.5 M20.1 19.5 Q13.5 18.6 12.3 25.2 M12.3 25.2 Q6.3 22.1 2.9 27.8 M43.9 3.1 Q35.0 8.7 40.2 17.9 M40.2 17.9 Q29.9 20.2 31.7 30.6 M31.7 30.6 Q21.2 29.2 19.3 39.5 M19.3 39.5 Q9.9 34.7 4.6 43.8 M61.8 4.3 Q49.3 12.3 56.6 25.2 M56.6 25.2 Q42.1 28.4 44.6 43.1 M44.6 43.1 Q29.9 41.1 27.2 55.7 M27.2 55.7 Q14.0 48.9 6.5 61.7" /></svg>
            <span class="hw-spider" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#hw-spider"></use></svg></span>
            <svg class="hw-moon" viewBox="0 0 48 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /><circle cx="31" cy="6" r="0.9" /><circle cx="39" cy="13" r="0.7" /><circle cx="33" cy="19" r="0.8" /><circle cx="44" cy="5" r="0.6" /></svg>
            <a class="brand-link" href="https://ghostify-extension.vercel.app/" target="_blank" rel="noopener noreferrer" aria-label="Open the Ghostify website">
                <img src="icons/icon32.png" alt="" class="header-icon">
                <h1>Ghostify</h1>
                <svg class="season-mark season-halloween" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8c-4.2 0-7.5 2.5-7.5 6s3.3 6 7.5 6 7.5-2.5 7.5-6-3.3-6-7.5-6Z" /><path d="M12 8c-2.2 1.6-2.2 10.4 0 12M12 8c2.2 1.6 2.2 10.4 0 12" /><path d="M12 8V5.5c0-1 .7-1.8 1.8-1.8" /></svg>
                <svg class="season-mark season-christmas" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 7.5 9.5h2.7L6 15.5h5V21h2v-5.5h5l-4.2-6h2.7Z" /></svg>
                <svg class="season-mark season-newyear" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3.5 12.6 9l5.4 1.6-5.4 1.6L11 17.7 9.4 12.2 4 10.6 9.4 9Z" /><path d="M18.5 15.5v4M16.5 17.5h4" /></svg>
                <svg class="season-mark season-valentine" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.4A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.5c0 5.8-7.5 10.4-7.5 10.4Z" /></svg>
            </a>
            <a class="header-verification" id="public-status-link" href="https://ghostify-extension.vercel.app/status" target="_blank" rel="noopener noreferrer" aria-label="Open Ghostify status page. Verification needs review." aria-describedby="public-status-tooltip" data-status="review">
                <span class="status-icon" aria-hidden="true"></span>
                <span class="verification-summary" id="public-status-summary" aria-live="polite">Review</span>
                <span class="status-tooltip" id="public-status-tooltip" role="tooltip">Public status details are loading.</span>
            </a>
        </header>

        <section class="view is-active" id="main-view" aria-label="Core controls">
            <section class="platform" aria-labelledby="instagram-heading">
                <svg class="hw-peek hw-peek--a" aria-hidden="true"><use href="#fx-ghost"></use></svg>
                <div class="platform-label platform-label--linked" id="instagram-heading">
                    <a class="platform-heading-link platform-heading-link--with-icon" href="https://instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Open Instagram">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="2" y="2" width="20" height="20" rx="5" />
                            <circle cx="12" cy="12" r="4" />
                            <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none" />
                        </svg>
                        <span>Instagram</span>
                    </a>
                    <span class="platform-count" aria-live="polite"></span>
                </div>
                <div class="card">
                    <label class="row">
                        <span class="row-label">
                            <span class="feature-chip" aria-hidden="true"><svg class="feature-icon seen-icon"><use href="#feature-seen"></use></svg></span>
                            <span>Hide Seen</span>
                        </span>
                        <span class="switch"><input type="checkbox" id="ig-seen" aria-label="Hide Instagram seen receipts"><span class="track"></span></span>
                    </label>
                    <label class="row">
                        <span class="row-label">
                            <span class="feature-chip" aria-hidden="true"><svg class="feature-icon typing-icon"><use href="#feature-typing"></use></svg></span>
                            <span>Hide Typing</span>
                        </span>
                        <span class="switch"><input type="checkbox" id="ig-typing" aria-label="Hide Instagram typing indicator"><span class="track"></span></span>
                    </label>
                    <label class="row">
                        <span class="row-label">
                            <span class="feature-chip" aria-hidden="true"><svg class="feature-icon story-icon"><use href="#feature-story"></use></svg></span>
                            <span>Hide Story Views</span>
                        </span>
                        <span class="switch"><input type="checkbox" id="ig-story" aria-label="Hide Instagram story views"><span class="track"></span></span>
                    </label>
                </div>
            </section>

            <section class="platform" aria-labelledby="facebook-messenger-heading">
                <svg class="hw-peek hw-peek--b" aria-hidden="true"><use href="#fx-ghost"></use></svg>
                <div class="platform-label platform-label--linked" id="facebook-messenger-heading">
                    <span class="platform-heading-links">
                        <a class="platform-heading-link platform-heading-link--with-icon" href="https://facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Open Facebook">
                            <svg class="platform-logo-facebook" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <circle cx="12" cy="12" r="10" fill="currentColor" />
                                <path class="platform-logo-knockout" d="M13.65 21v-8h2.7l.4-3.1h-3.1V7.92c0-.9.25-1.51 1.55-1.51h1.65V3.63c-.29-.04-1.27-.13-2.42-.13-2.4 0-4.04 1.46-4.04 4.15V9.9H7.67V13h2.72v8h3.26Z" />
                            </svg>
                            <span>Facebook</span>
                        </a>
                        <span aria-hidden="true">/</span>
                        <a class="platform-heading-link platform-heading-link--with-icon" href="https://messenger.com/" target="_blank" rel="noopener noreferrer" aria-label="Open Messenger">
                            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.477 2 2 6.145 2 11.26c0 2.915 1.455 5.515 3.73 7.214V22l3.408-1.87c.91.252 1.872.389 2.862.389 5.523 0 10-4.145 10-9.26C22 6.145 17.523 2 12 2Zm.995 12.468-2.547-2.716-4.97 2.716 5.468-5.804 2.608 2.716 4.91-2.716-5.469 5.804Z" /></svg>
                            <span>Messenger</span>
                        </a>
                    </span>
                    <span class="platform-count" aria-live="polite"></span>
                </div>
                <div class="card">
                    <div class="row">
                        <label class="row-label" for="msg-seen">
                            <span class="feature-chip" aria-hidden="true"><svg class="feature-icon seen-icon"><use href="#feature-seen"></use></svg></span>
                            <span>Hide Seen</span>
                        </label>
                        <label class="switch"><input type="checkbox" id="msg-seen" aria-label="Hide Messenger and Facebook seen receipts"><span class="track"></span></label>
                    </div>
                    <label class="row">
                        <span class="row-label">
                            <span class="feature-chip" aria-hidden="true"><svg class="feature-icon typing-icon"><use href="#feature-typing"></use></svg></span>
                            <span>Hide Typing</span>
                        </span>
                        <span class="switch"><input type="checkbox" id="msg-typing" aria-label="Hide Messenger and Facebook typing indicator"><span class="track"></span></span>
                    </label>
                    <label class="row">
                        <span class="row-label">
                            <span class="feature-chip" aria-hidden="true"><svg class="feature-icon story-icon"><use href="#feature-story"></use></svg></span>
                            <span>Hide Story Views</span>
                        </span>
                        <span class="switch"><input type="checkbox" id="msg-story" aria-label="Hide Messenger and Facebook story views"><span class="track"></span></span>
                    </label>
                </div>
            </section>
        </section>

        <footer class="footer">
            <svg class="hw-patch" viewBox="0 0 112 32" aria-hidden="true">
                <use class="hw-pk hw-pk--1" href="#hw-jack" x="2" y="3" width="30" height="30"></use>
                <use class="hw-pk hw-pk--2" href="#fx-pumpkin" x="30" y="15" width="17" height="17"></use>
                <use class="hw-pk hw-pk--3" href="#hw-jack" x="45" y="9" width="23" height="23"></use>
                <use class="hw-pk hw-pk--4" href="#fx-pumpkin" x="67" y="20" width="12" height="12"></use>
            </svg>
            <div class="footer-start">
                <span id="version-number"></span>
                <button type="button" class="sound-toggle" id="sound-toggle" aria-pressed="false" aria-label="Sound effects">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path class="sound-body" d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5Z" />
                        <path class="sound-waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
                        <path class="sound-slash" d="m15.5 9.5 5 5m0-5-5 5" />
                    </svg>
                </button>
            </div>
            <nav class="footer-links" aria-label="Ghostify links">
                <a class="footer-link rate-link" href="https://chromewebstore.google.com/detail/ghostify-hide-seen-typing/flpnibonbhdmnpgflnbemgghghhblmpm/reviews" target="_blank" rel="noopener noreferrer" aria-label="Rate Ghostify on the Chrome Web Store" data-tooltip="Enjoying Ghostify? Leave a quick rating on the Chrome Web Store.">Rate Ghostify</a>
                <button type="button" class="footer-link support-link" id="help-trigger" aria-haspopup="true" aria-expanded="false" aria-controls="help-menu" data-tooltip="Helpful bug reports or ideas will be credited in release notes and on the website, with permission.">Help &amp; feedback</button>
            </nav>
            <div class="help-menu" id="help-menu" role="group" aria-label="Help and feedback options" hidden>
                <a class="help-item" href="https://github.com/Hendrizzzz/Ghostify/issues/new?template=help_feedback.yml" target="_blank" rel="noopener noreferrer" aria-label="Get help or share feedback using a guided GitHub form">
                    <svg class="help-item-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a9.5 9.5 0 0 0-3 18.5c.5.1.65-.2.65-.46v-1.65c-2.65.58-3.2-1.12-3.2-1.12-.43-1.1-1.06-1.4-1.06-1.4-.87-.6.07-.58.07-.58.96.07 1.47.99 1.47.99.85 1.46 2.24 1.04 2.78.8.09-.62.33-1.04.6-1.28-2.1-.24-4.33-1.05-4.33-4.7 0-1.04.37-1.89.98-2.55-.1-.24-.43-1.21.09-2.52 0 0 .8-.26 2.62.97a9 9 0 0 1 4.76 0c1.82-1.23 2.62-.97 2.62-.97.52 1.31.19 2.28.1 2.52.61.66.98 1.51.98 2.55 0 3.66-2.23 4.46-4.35 4.7.34.3.65.88.65 1.78v2.64c0 .26.16.56.66.46A9.5 9.5 0 0 0 12 2.5Z" /></svg>
                    <span class="help-item-text"><span class="help-item-title">Report on GitHub</span><span class="help-item-note">Guided form, public</span></span>
                </a>
                <div class="help-item help-item--email">
                    <button type="button" class="help-item-main" id="help-copy" data-email="hendrizzzz.dev@gmail.com" aria-label="Copy email address hendrizzzz.dev@gmail.com">
                        <svg class="help-item-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" /><path d="m4 8 8 6 8-6" /></svg>
                        <span class="help-item-text"><span class="help-item-title" id="help-copy-title">Copy email address</span><span class="help-item-note">hendrizzzz.dev@gmail.com</span></span>
                    </button>
                </div>
            </div>
        </footer>
    </main>

    <script src="js/popup.js"></script>
</body>

</html>
